name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lyrics-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-widget-apk
          path: lyrics-widget.apk
      - name: Publish release (tags named android-v*)
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lyrics-widget.apk --title "Lyrics Widget for Android ${GITHUB_REF_NAME#android-v}" --notes "Install lyrics-widget.apk, then follow the setup steps in android/README.md."
